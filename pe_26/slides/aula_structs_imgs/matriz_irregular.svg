<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Matriz com linhas de tamanhos diferentes</title>
  <desc id="desc">m aponta para um vetor de três ponteiros. Cada ponteiro aponta para um bloco independente: m[0] tem 2 inteiros, m[1] tem 5 e m[2] tem 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#27638c"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="22" fill="#163c56">
    <text x="35" y="142" font-family="monospace">m</text>
    <text x="18" y="171" font-family="monospace" font-size="18">int **</text>
    <text x="145" y="35">Vetor de ponteiros</text>
    <text x="510" y="28">Blocos alocados independentemente</text>
    <text x="460" y="60">m[0] — 2 inteiros</text>
    <text x="590" y="160">m[1] — 5 inteiros</text>
    <text x="490" y="260">m[2] — 3 inteiros</text>
  </g>
  <rect x="220" y="80" width="80" height="180" rx="3" fill="#e6f4ea" stroke="#287347" stroke-width="2"/>
  <path d="M220 140h80 M220 200h80" stroke="#287347" stroke-width="2"/>
  <g font-family="monospace" font-size="18" fill="#163c56" text-anchor="end">
    <text x="208" y="116">[0]</text><text x="208" y="176">[1]</text><text x="208" y="236">[2]</text>
  </g>
  <g fill="#27638c">
    <circle cx="260" cy="110" r="5"/><circle cx="260" cy="170" r="5"/><circle cx="260" cy="230" r="5"/>
  </g>
  <g fill="none" stroke="#27638c" stroke-width="3" marker-end="url(#arrow)">
    <path d="M70 135H140V92H217"/>
    <path d="M260 110H380V98H455"/>
    <path d="M260 170H420V198H585"/>
    <path d="M260 230H380V298H485"/>
  </g>
  <g fill="#eaf3fb" stroke="#27638c" stroke-width="2">
    <rect x="460" y="72" width="140" height="52" rx="3"/>
    <rect x="590" y="172" width="350" height="52" rx="3"/>
    <rect x="490" y="272" width="210" height="52" rx="3"/>
    <path d="M530 72v52 M660 172v52 M730 172v52 M800 172v52 M870 172v52 M560 272v52 M630 272v52"/>
  </g>
  <g fill="#163c56" font-family="monospace" font-size="18" text-anchor="middle">
    <text x="495" y="105">[0]</text><text x="565" y="105">[1]</text>
    <text x="625" y="205">[0]</text><text x="695" y="205">[1]</text><text x="765" y="205">[2]</text><text x="835" y="205">[3]</text><text x="905" y="205">[4]</text>
    <text x="525" y="305">[0]</text><text x="595" y="305">[1]</text><text x="665" y="305">[2]</text>
  </g>
</svg>
